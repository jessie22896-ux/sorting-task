<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>詞彙快速分類作業</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; padding: 0;
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background-color: #0f172a; color: #f8fafc;
      display: flex; flex-direction: column; min-height: 100vh;
      user-select: none;
    }
    .container {
      max-width: 720px; width: 100%; margin: 0 auto; padding: 16px;
      flex: 1; display: flex; flex-direction: column; justify-content: space-between;
    }
    .header-labels {
      display: flex; justify-content: space-between; gap: 12px;
      min-height: 88px;
    }
    .cat-box {
      flex: 1; border: 2px solid #334155; border-radius: 12px;
      padding: 10px 12px; background: #1e293b;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center;
    }
    .cat-key { font-size: 12px; color: #94a3b8; margin-bottom: 4px; }
    .cat-target { font-size: 20px; font-weight: 700; color: #38bdf8; line-height: 1.3; }
    .cat-or { font-size: 13px; color: #94a3b8; margin: 2px 0; }
    .cat-attr { font-size: 20px; font-weight: 700; color: #4ade80; line-height: 1.3; }

    .stage {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; padding: 20px 10px; min-height: 280px;
    }
    .stimulus {
      font-size: 38px; font-weight: 800; letter-spacing: 2px;
      margin: 16px 0; min-height: 56px;
    }
    .stim-target { color: #38bdf8; }
    .stim-attr { color: #4ade80; }
    .error-x {
      font-size: 48px; font-weight: 900; color: #ef4444;
      height: 54px; line-height: 54px; visibility: hidden;
    }
    .error-x.show { visibility: visible; }

    .controls {
      display: flex; gap: 16px; margin-bottom: 12px;
    }
    .touch-btn {
      flex: 1; height: 76px; border: none; border-radius: 14px;
      background: #334155; color: #f8fafc; font-size: 20px; font-weight: 700;
      cursor: pointer; transition: background 0.1s;
    }
    .touch-btn:active { background: #475569; }

    .card {
      background: #1e293b; border: 1px solid #334155; border-radius: 16px;
      padding: 24px; text-align: left; line-height: 1.7;
    }
    .card h2 { margin-top: 0; font-size: 22px; color: #f8fafc; }
    .input-group { margin: 16px 0; }
    .input-group label { display: block; font-size: 14px; color: #cbd5e1; margin-bottom: 6px; }
    .input-group input, .input-group select {
      width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #475569;
      background: #0f172a; color: #f8fafc; font-size: 16px;
    }
    .primary-btn {
      width: 100%; padding: 14px; border: none; border-radius: 10px;
      background: #2563eb; color: #fff; font-size: 18px; font-weight: 700;
      cursor: pointer; margin-top: 12px;
    }
    .primary-btn:disabled { background: #475569; cursor: not-allowed; }
    .progress { text-align: center; font-size: 13px; color: #94a3b8; margin-bottom: 8px; }
    .badge-target { color: #38bdf8; font-weight: 700; }
    .badge-attr { color: #4ade80; font-weight: 700; }
  </style>
</head>
<body>
  <div class="container" id="app"></div>

  <script>
    // ====== 已綁定你的 Google Apps Script 網頁應用程式網址 ======
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyN94Lb80P8wixwbGDJ-fiNrPwm0hRrY8xmXKJsZTU9Xt_WGUSzBuf-khH1U570HKly9Q/exec";

    // ====== 實驗刺激字詞（招募面試階段：AI面試評估 vs. 面試官判斷，4 類別 × 5 字詞 = 20 字詞）======
    const CATEGORIES = {
      targetA: {
        name: "AI面試評估",
        type: "target",
        words: ["AI視訊面試", "演算法評分", "語意分析", "表情辨識", "自動化篩選"]
      },
      targetB: {
        name: "面試官判斷",
        type: "target",
        words: ["人資面談", "用人主管", "人工審核", "直覺觀察", "現場互動"]
      },
      attrA: {
        name: "值得信賴",
        type: "attr",
        words: ["精準", "客觀", "可靠", "公正", "透明"]
      },
      attrB: {
        name: "令人疑慮",
        type: "attr",
        words: ["偏見", "黑箱", "誤判", "僵化", "盲點"]
      }
    };

    // ====== 標準 7 區段設計（共 180 題：20, 20, 20, 40, 20, 20, 40）======
    function buildBlocks(isReversedFirst) {
      const firstT = isReversedFirst ? "targetB" : "targetA";
      const secondT = isReversedFirst ? "targetA" : "targetB";
      const condPractice1 = isReversedFirst ? "incongruent_practice" : "congruent_practice";
      const condTest1     = isReversedFirst ? "incongruent_test"     : "congruent_test";
      const condPractice2 = isReversedFirst ? "congruent_practice"   : "incongruent_practice";
      const condTest2     = isReversedFirst ? "congruent_test"       : "incongruent_test";

      return [
        { block: 1, name: "區段 1 / 7（練習）", trials: 20, condition: "practice_target",
          left: [firstT], right: [secondT], mix: "target" },
        { block: 2, name: "區段 2 / 7（練習）", trials: 20, condition: "practice_attr",
          left: ["attrA"], right: ["attrB"], mix: "attr" },
        { block: 3, name: "區段 3 / 7（正式測驗）", trials: 20, condition: condPractice1,
          left: [firstT, "attrA"], right: [secondT, "attrB"], mix: "both" },
        { block: 4, name: "區段 4 / 7（正式測驗）", trials: 40, condition: condTest1,
          left: [firstT, "attrA"], right: [secondT, "attrB"], mix: "both" },
        { block: 5, name: "區段 5 / 7（練習）", trials: 20, condition: "practice_target_switch",
          left: [secondT], right: [firstT], mix: "target" },
        { block: 6, name: "區段 6 / 7（正式測驗）", trials: 20, condition: condPractice2,
          left: [secondT, "attrA"], right: [firstT, "attrB"], mix: "both" },
        { block: 7, name: "區段 7 / 7（正式測驗）", trials: 40, condition: condTest2,
          left: [secondT, "attrA"], right: [firstT, "attrB"], mix: "both" }
      ];
    }

    let participantId = "";
    let attemptNum = "1";
    let orderCondition = "A_first";
    let blocks = [];
    let currentBlockIdx = 0;
    let currentTrials = [];
    let currentTrialIdx = 0;
    let trialStartTime = 0;
    let hadErrorInTrial = false;
    let awaitingResponse = false;
    const allResults = [];

    const app = document.getElementById("app");

    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function generateTrialsForBlock(blockCfg) {
      const list = [];
      const makeItems = (catKeys, side) => {
        const items = [];
        catKeys.forEach(k => {
          CATEGORIES[k].words.forEach(w => {
            items.push({ word: w, category: CATEGORIES[k].name, catKey: k, type: CATEGORIES[k].type, correctSide: side });
          });
        });
        return items;
      };

      if (blockCfg.mix === "target" || blockCfg.mix === "attr") {
        const pool = [...makeItems(blockCfg.left, "left"), ...makeItems(blockCfg.right, "right")];
        return shuffle([...pool, ...pool]).slice(0, blockCfg.trials);
      } else {
        const targets = shuffle([...makeItems([blockCfg.left[0]], "left"), ...makeItems([blockCfg.right[0]], "right")]);
        const attrs = shuffle([...makeItems([blockCfg.left[1]], "left"), ...makeItems([blockCfg.right[1]], "right")]);
        const rounds = blockCfg.trials / 20;
        for (let r = 0; r < rounds; r++) {
          const tRound = shuffle(targets);
          const aRound = shuffle(attrs);
          for (let i = 0; i < 10; i++) {
            list.push(tRound[i]);
            list.push(aRound[i]);
          }
        }
        return list;
      }
    }

    function renderWelcome() {
      app.innerHTML = `
        <div class="card">
          <h2>詞彙快速分類作業</h2>
          <p>歡迎參與本次詞彙分類測驗！本測驗共分為 <strong>7 個區段</strong>（約 3～5 分鐘），請您依照畫面上方的類別提示，盡快且準確地將螢幕中央出現的詞彙歸類到<strong>左側</strong>或<strong>右側</strong>。</p>
          <ul>
            <li><strong>電腦操作：</strong>按鍵盤 <kbd>E</kbd> 鍵（選左邊）或 <kbd>I</kbd> 鍵（選右邊）。</li>
            <li><strong>手機操作：</strong>直接點擊畫面下方的「左側」或「右側」按鈕。</li>
            <li>若分類錯誤，畫面會出現紅色 <strong>X</strong>，請改按另一側繼續。</li>
          </ul>
          <div class="input-group">
            <label for="pid">請輸入受測者代碼（請勿填寫真實姓名或學號，例如：P01、P02）：</label>
            <input type="text" id="pid" placeholder="例如：P01" maxlength="20" />
          </div>
          <div class="input-group">
            <label for="attempt">請選擇本次作答次數：</label>
            <select id="attempt">
              <option value="1">第 1 次</option>
              <option value="2">第 2 次</option>
            </select>
          </div>
          <button class="primary-btn" id="startBtn">開始測驗</button>
        </div>
      `;
      document.getElementById("startBtn").onclick = () => {
        const val = document.getElementById("pid").value.trim();
        if (!val) { alert("請先輸入受測者代碼！"); return; }
        attemptNum = document.getElementById("attempt").value;
        participantId = val + "_第" + attemptNum + "次";

        // 每次重新整理網頁隨機指派先出現配對 A 或配對 B（確保重整幾次會輪流出現 A 與 B）
        const isRev = Math.random() < 0.5;
        orderCondition = isRev ? "B_first" : "A_first";
        blocks = buildBlocks(isRev);
        currentBlockIdx = 0;
        renderBlockIntro();
      };
    }

    function renderLabelHtml(catKeys) {
      return catKeys.map((k, idx) => {
        const c = CATEGORIES[k];
        const cls = c.type === "target" ? "cat-target" : "cat-attr";
        return (idx > 0 ? `<div class="cat-or">或</div>` : "") + `<div class="${cls}">${c.name}</div>`;
      }).join("");
    }

    function renderBlockIntro() {
      const b = blocks[currentBlockIdx];
      const leftNames = b.left.map(k => `<span class="${CATEGORIES[k].type === 'target' ? 'badge-target' : 'badge-attr'}">${CATEGORIES[k].name}</span>`).join(" 或 ");
      const rightNames = b.right.map(k => `<span class="${CATEGORIES[k].type === 'target' ? 'badge-target' : 'badge-attr'}">${CATEGORIES[k].name}</span>`).join(" 或 ");

      app.innerHTML = `
        <div class="header-labels">
          <div class="cat-box"><div class="cat-key">左側（按 E 鍵）</div>${renderLabelHtml(b.left)}</div>
          <div class="cat-box"><div class="cat-key">右側（按 I 鍵）</div>${renderLabelHtml(b.right)}</div>
        </div>
        <div class="card">
          <h2>${b.name}（共 ${b.trials} 題）</h2>
          <p>請注意上方類別位置已更新：</p>
          <ul>
            <li>屬於 ${leftNames} 的詞彙 → 請選<strong>左側（E 鍵）</strong></li>
            <li>屬於 ${rightNames} 的詞彙 → 請選<strong>右側（I 鍵）</strong></li>
          </ul>
          <p>請盡量<strong>越快越好</strong>，同時保持高準確率。準備好後請點擊下方按鈕開始。</p>
          <button class="primary-btn" id="goBlockBtn">開始本區段</button>
        </div>
        <div></div>
      `;
      document.getElementById("goBlockBtn").onclick = () => {
        currentTrials = generateTrialsForBlock(b);
        currentTrialIdx = 0;
        renderTrialScreen();
      };
    }

    function renderTrialScreen() {
      const b = blocks[currentBlockIdx];
      app.innerHTML = `
        <div>
          <div class="progress">${b.name} ｜ 第 <span id="tNum">1</span> / ${b.trials} 題</div>
          <div class="header-labels">
            <div class="cat-box"><div class="cat-key">左側（E）</div>${renderLabelHtml(b.left)}</div>
            <div class="cat-box"><div class="cat-key">右側（I）</div>${renderLabelHtml(b.right)}</div>
          </div>
        </div>
        <div class="stage">
          <div class="stimulus" id="stimWord">+</div>
          <div class="error-x" id="errX">X</div>
        </div>
        <div class="controls">
          <button class="touch-btn" id="leftBtn">← 左側 (E)</button>
          <button class="touch-btn" id="rightBtn">右側 (I) →</button>
        </div>
      `;
      document.getElementById("leftBtn").onclick = () => handleResponse("left");
      document.getElementById("rightBtn").onclick = () => handleResponse("right");
      showNextTrial();
    }

    function showNextTrial() {
      awaitingResponse = false;
      hadErrorInTrial = false;
      const stimEl = document.getElementById("stimWord");
      const errEl = document.getElementById("errX");
      errEl.classList.remove("show");
      stimEl.textContent = "+";
      stimEl.className = "stimulus";
      document.getElementById("tNum").textContent = currentTrialIdx + 1;

      setTimeout(() => {
        const t = currentTrials[currentTrialIdx];
        stimEl.textContent = t.word;
        stimEl.className = "stimulus " + (t.type === "target" ? "stim-target" : "stim-attr");
        trialStartTime = performance.now();
        awaitingResponse = true;
      }, 250);
    }

    function handleResponse(chosenSide) {
      if (!awaitingResponse) return;
      const t = currentTrials[currentTrialIdx];
      const b = blocks[currentBlockIdx];

      if (chosenSide !== t.correctSide) {
        hadErrorInTrial = true;
        document.getElementById("errX").classList.add("show");
        return;
      }

      awaitingResponse = false;
      const rt = Math.round(performance.now() - trialStartTime);

      allResults.push({
        participant_id: participantId,
        order_condition: orderCondition,
        block: b.block,
        condition: b.condition,
        trial: currentTrialIdx + 1,
        stimulus: t.word,
        category: t.category,
        correct_side: t.correctSide,
        response_side: chosenSide,
        error: hadErrorInTrial ? 1 : 0,
        rt_ms: rt
      });

      currentTrialIdx++;
      if (currentTrialIdx < currentTrials.length) {
        showNextTrial();
      } else {
        currentBlockIdx++;
        if (currentBlockIdx < blocks.length) {
          renderBlockIntro();
        } else {
          submitAndFinish();
        }
      }
    }

    document.addEventListener("keydown", (e) => {
      if (e.key === "e" || e.key === "E") handleResponse("left");
      if (e.key === "i" || e.key === "I") handleResponse("right");
    });

    async function submitAndFinish() {
      app.innerHTML = `
        <div class="card">
          <h2>測驗完成，正在上傳作答紀錄...</h2>
          <p>請稍候，切勿關閉視窗。</p>
        </div>
      `;

      const payload = {
        participant_id: participantId,
        timestamp: new Date().toISOString(),
        trials: allResults
      };

      let statusMsg = "您的作答紀錄已成功送出！";
      try {
        if (SCRIPT_URL && !SCRIPT_URL.includes("YOUR_APPS_SCRIPT")) {
          await fetch(SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });
        } else {
          statusMsg = "測驗已完成！（提示：尚未填入 Apps Script 網址，目前為本機測試模式）";
        }
      } catch (err) {
        statusMsg = "測驗已完成，但資料傳送時發生網路異常，請截圖通知研究人員。";
      }

      app.innerHTML = `
        <div class="card">
          <h2>感謝您的參與！</h2>
          <p>${statusMsg}</p>
          <p>受測者代碼：<strong>${participantId}</strong>（共完成 ${allResults.length} 題）</p>
          <p>您現在可以安全地關閉此網頁。</p>
        </div>
      `;
    }

    renderWelcome();
  </script>
</body>
</html>
